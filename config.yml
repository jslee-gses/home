params:
    description: "Jae Seung Lee's academic website: research papers, books, projects, awards, and curriculum vitae."
    author: Jae Seung Lee
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["papers","books","grants","projects","awards"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Jae Seung Lee, Ph.D.
          subtitle: "Professor at the Graduate School of Environmental Studies, Seoul National University, working at the intersection of urban design and data science. My research asks how cities can remain resilient, walkable, and equitable as they confront demographic decline and climate change — drawing on big data and AI to understand how urban form shapes everyday life. I hold a Ph.D. in Urban and Regional Planning from MIT and master's degrees in Architecture and Urban Design from the University of Michigan."
          buttons:
            - name: Papers
              url: papers/
            - name: Books
              url: books/
            - name: Grants
              url: grants/
            - name: Projects
              url: projects/
            - name: Awards
              url: awards/
            - name: CV
              url: cv/

    socialIcons:
        - name: Email
          url: mailto:js.lee@snu.ac.kr
        - name: Google Scholar
          url: https://scholar.google.co.kr/citations?user=4ejXZ0kAAAAJ&hl=en
        - name: ORCID
          url: https://orcid.org/0000-0001-9087-5975
        - name: ResearchGate
          url: https://www.researchgate.net/profile/Jae-Seung-Lee-2
        - name: Lab
          url: http://usdl.snu.ac.kr

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Jae Seung Lee"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
