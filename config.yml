    profileMode:
          enabled: true
          title: "<span style='font-size:1.5rem;'>이제승</span> Jae Seung Lee, Ph.D."
          subtitle: "<span style='display:block;'>도시설계와 데이터 과학의 접점에서, 인구감소와 기후변화 시대에 도시가 어떻게 탄소중립적이고, 보행친화적이며, 활력있는 공간으로 남을 수 있을지를 탐구합니다.</span><span style='display:block;margin-top:0.6em;opacity:0.65;font-size:0.92em;'>Professor at the Graduate School of Environmental Studies, Seoul National University, working at the intersection of urban design and data science. My research asks how cities can remain carbon-neutral, walkable, and vibrant as they confront demographic decline and climate change — drawing on big data and AI to understand how urban form shapes everyday life. I hold a Ph.D. in Urban and Regional Planning from MIT and master's degrees in Architecture and Urban Design from the University of Michigan.</span>"
          buttons:
            - name: Papers
              url: papers/
            - name: Books
              url: books/
            - name: Grants
              url: grants/
            - name: Projects
              url: projects/
            - name: Awards
              url: awards/
            - name: CV
              url: cv/

    socialIcons:
